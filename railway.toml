[build]
buildCommand = "uv run python manage.py collectstatic --noinput"

[deploy]
startCommand = "sh -c 'python manage.py migrate --noinput && gunicorn a_core.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 120 --access-logfile - --error-logfile -'"
restartPolicyType = "on_failure"
