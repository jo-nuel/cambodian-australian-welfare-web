{% extends "base.html" %}

{% block title %}Link Expired | CAWC NSW{% endblock %}

{% block content %}
<section class="bg-[linear-gradient(180deg,#FAFAF7_0%,#F4F1EA_100%)] py-24 lg:py-36">
    <div class="mx-auto w-full max-w-[680px] px-5 text-center sm:px-6 lg:px-8">
        <div class="mx-auto mb-8 flex h-16 w-16 items-center justify-center rounded-full bg-[var(--cawc-green)]/10">
            <svg class="h-8 w-8 text-[var(--cawc-green)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h1 class="text-3xl font-black tracking-tight text-[var(--cawc-text-strong)] sm:text-4xl">This link has expired</h1>
        <p class="mt-4 text-lg leading-relaxed text-slate-600">
            Confirmation links are valid for 48 hours. This one is no longer active.
        </p>
        <p class="mt-3 text-sm text-slate-500">
            Re-enter your email below to receive a fresh confirmation link.
        </p>
        <a href="/#newsletter" class="cawc-donate-btn mt-10 inline-block">Subscribe again</a>
    </div>
</section>
{% endblock %}
