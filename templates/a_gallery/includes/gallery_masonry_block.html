{% load wagtailimages_tags %}

<div class="gallery-shell" data-gallery-root data-initial-visible="{{ initial_visible|default:12 }}" data-batch-size="{{ batch_size|default:8 }}">
    {% if entries %}
        <div class="gallery-masonry" data-gallery-grid>
            {% for entry in entries %}
                <figure class="gallery-masonry__item" data-gallery-item>
                    <button type="button"
                            class="gallery-masonry__button"
                            data-gallery-open
                            data-gallery-tag="{{ entry.tag_display }}"
                            data-gallery-caption="{{ entry.caption|default:'' }}"
                            aria-label="Open {{ entry.tag_display }}">
                        <div class="gallery-masonry__media">
                            {% image entry.image width-1200 class="gallery-masonry__image" %}
                        </div>
                        <span class="gallery-masonry__tag">{{ entry.tag_display }}</span>
                    </button>
                </figure>
            {% endfor %}
        </div>

        <div class="mt-8 text-center" data-gallery-more-wrap {% if entries|length <= initial_visible %}hidden{% endif %}>
            <button type="button"
                    data-gallery-more
                    class="inline-flex h-11 items-center justify-center rounded-full bg-[var(--cawc-green)] px-7 text-[13px] font-semibold text-white transition hover:bg-[var(--cawc-green-strong)]">
                Load more photos
            </button>
        </div>

        <div class="gallery-lightbox" data-gallery-lightbox hidden>
            <button type="button" class="gallery-lightbox__backdrop" data-gallery-close aria-label="Close gallery view"></button>

            <div class="gallery-lightbox__frame" role="dialog" aria-modal="true" aria-label="Expanded gallery image">
                <button type="button" class="gallery-lightbox__icon gallery-lightbox__icon--close" data-gallery-close aria-label="Close">
                    ×
                </button>

                <button type="button" class="gallery-lightbox__icon gallery-lightbox__icon--prev" data-gallery-prev aria-label="Previous image">
                    ‹
                </button>

                <div class="gallery-lightbox__stage" data-gallery-stage>
                    <img class="gallery-lightbox__image" data-gallery-lightbox-image src="" alt="">
                </div>

                <button type="button" class="gallery-lightbox__icon gallery-lightbox__icon--next" data-gallery-next aria-label="Next image">
                    ›
                </button>

                <div class="gallery-lightbox__meta">
                    <span class="gallery-lightbox__tag" data-gallery-lightbox-tag></span>
                    <p class="gallery-lightbox__caption" data-gallery-lightbox-caption></p>
                    <button type="button" class="gallery-lightbox__zoom" data-gallery-zoom>
                        Zoom
                    </button>
                </div>
            </div>
        </div>
    {% else %}
        <div class="gallery-empty">
            <div class="gallery-empty__panel">
                <p class="gallery-empty__eyebrow">Gallery Ready</p>
                <p class="gallery-empty__copy">{{ empty_message }}</p>
            </div>
        </div>
    {% endif %}
</div>
