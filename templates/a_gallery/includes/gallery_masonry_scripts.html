<script>
    (function () {
        function initGallery(root) {
            const items = Array.from(root.querySelectorAll("[data-gallery-item]"));
            const moreWrap = root.querySelector("[data-gallery-more-wrap]");
            const moreButton = root.querySelector("[data-gallery-more]");
            const initialVisible = parseInt(root.dataset.initialVisible || "12", 10);
            const batchSize = parseInt(root.dataset.batchSize || "8", 10);
            let visibleCount = Math.min(initialVisible, items.length);

            function updateVisibleItems() {
                items.forEach((item, index) => {
                    item.hidden = index >= visibleCount;
                });
                if (moreWrap) {
                    moreWrap.hidden = visibleCount >= items.length;
                }
            }

            updateVisibleItems();

            if (moreButton) {
                moreButton.addEventListener("click", function () {
                    visibleCount = Math.min(visibleCount + batchSize, items.length);
                    updateVisibleItems();
                });
            }

            const lightbox = root.querySelector("[data-gallery-lightbox]");
            if (!lightbox || !items.length) {
                return;
            }

            const lightboxImage = lightbox.querySelector("[data-gallery-lightbox-image]");
            const lightboxTag = lightbox.querySelector("[data-gallery-lightbox-tag]");
            const lightboxCaption = lightbox.querySelector("[data-gallery-lightbox-caption]");
            const stage = lightbox.querySelector("[data-gallery-stage]");
            const zoomButton = lightbox.querySelector("[data-gallery-zoom]");
            let activeIndex = 0;
            let wheelLocked = false;

            function setImage(index) {
                activeIndex = (index + items.length) % items.length;
                const currentItem = items[activeIndex];
                const button = currentItem.querySelector("[data-gallery-open]");
                const image = currentItem.querySelector("img");
                lightboxImage.src = image.currentSrc || image.src;
                lightboxImage.alt = button.dataset.galleryTag || "Gallery image";
                lightboxTag.textContent = button.dataset.galleryTag || "Photo";
                lightboxCaption.textContent = button.dataset.galleryCaption || "";
            }

            function openLightbox(index) {
                setImage(index);
                lightbox.hidden = false;
                lightbox.classList.remove("is-zoomed");
                document.body.style.overflow = "hidden";
            }

            function closeLightbox() {
                lightbox.hidden = true;
                lightbox.classList.remove("is-zoomed");
                document.body.style.overflow = "";
            }

            function step(direction) {
                setImage(activeIndex + direction);
            }

            items.forEach((item, index) => {
                const trigger = item.querySelector("[data-gallery-open]");
                trigger.addEventListener("click", function () {
                    openLightbox(index);
                });
            });

            lightbox.querySelectorAll("[data-gallery-close]").forEach((button) => {
                button.addEventListener("click", closeLightbox);
            });

            const prevButton = lightbox.querySelector("[data-gallery-prev]");
            const nextButton = lightbox.querySelector("[data-gallery-next]");

            if (prevButton) {
                prevButton.addEventListener("click", function () {
                    step(-1);
                });
            }

            if (nextButton) {
                nextButton.addEventListener("click", function () {
                    step(1);
                });
            }

            if (zoomButton) {
                zoomButton.addEventListener("click", function () {
                    lightbox.classList.toggle("is-zoomed");
                });
            }

            if (stage) {
                stage.addEventListener("click", function () {
                    lightbox.classList.toggle("is-zoomed");
                });

                stage.addEventListener(
                    "wheel",
                    function (event) {
                        if (wheelLocked) {
                            return;
                        }
                        event.preventDefault();
                        wheelLocked = true;
                        step(event.deltaY > 0 ? 1 : -1);
                        window.setTimeout(function () {
                            wheelLocked = false;
                        }, 180);
                    },
                    { passive: false }
                );
            }

            document.addEventListener("keydown", function (event) {
                if (lightbox.hidden) {
                    return;
                }
                if (event.key === "Escape") {
                    closeLightbox();
                } else if (event.key === "ArrowRight") {
                    step(1);
                } else if (event.key === "ArrowLeft") {
                    step(-1);
                }
            });
        }

        document.querySelectorAll("[data-gallery-root]").forEach(initGallery);
    })();
</script>
