{% extends "base.html" %}

{% block title %}{{ page.title }} | CAWC NSW{% endblock %}

{% block content %}

<section class="bg-[linear-gradient(160deg,var(--cawc-green-deep)_0%,var(--cawc-green-deepest)_100%)] min-h-[80vh] flex items-center">
    <div class="mx-auto w-full max-w-[1180px] px-5 py-20 sm:px-6 lg:px-8">

        <div class="flex flex-col items-center gap-12 lg:flex-row lg:items-center lg:gap-16">

            {# Facebook logo block #}
            <div class="shrink-0">
                <div class="flex h-64 w-64 items-center justify-center rounded-[2.5rem] bg-[#1877F2] shadow-[0_32px_80px_rgba(24,119,242,0.50)] sm:h-72 sm:w-72">
                    <svg class="h-40 w-40 text-white sm:h-44 sm:w-44" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
                    </svg>
                </div>
            </div>

            {# Text block #}
            <div class="text-center lg:text-left">
                <h1 class="text-[3rem] font-black tracking-[-0.05em] text-white sm:text-[4rem] lg:text-[4.8rem]">
                    {{ page.title }}
                </h1>
                <p class="mt-6 max-w-[540px] text-[1.35rem] font-bold leading-[1.5] text-white sm:text-[1.6rem]">
                    {{ page.intro_display }}
                </p>
                <a href="{{ page.facebook_url_display }}"
                   target="_blank"
                   rel="noopener"
                   class="mt-10 inline-flex items-center gap-3 text-[15px] font-semibold text-white/80 transition hover:text-white">
                    <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
                    </svg>
                    {{ page.facebook_button_text_display }}
                </a>
            </div>

        </div>
    </div>
</section>

{% endblock %}
